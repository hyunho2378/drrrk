name: DRRRK
options:
  bundleIdPrefix: app.drrrk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  DRRRK:
    type: application
    platform: iOS
    sources:
      - path: DRRRK
    info:
      path: DRRRK/Info.plist
      properties:
        CFBundleDisplayName: 드르륵칵
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIAppFonts:
          - SUIT-Regular.otf
          - SUIT-Medium.otf
          - SUIT-SemiBold.otf
          - SUIT-Bold.otf
          - SUIT-ExtraBold.otf
          - SUIT-Heavy.otf
        NSMicrophoneUsageDescription: 드르륵 방에서 목소리로 이야기하려면 마이크가 필요해요.
        NSSpeechRecognitionUsageDescription: 말한 내용을 채팅 글자로 옮기려면 음성 인식이 필요해요.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
